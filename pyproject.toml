[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navigator-ai"
version = "0.1.0"
description = "AI agent that joins meetings and gives live interactive demos of a web product"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "langgraph>=1.0",
    "redis>=8.1.0",
    "fakeredis>=2.37.0",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Phase 2+ runtime deps. Kept out of the base install so the core stays lean.
voice = ["piper-tts>=1.4", "silero-vad>=5.1", "groq>=0.11", "websockets>=12"]
memory = ["chromadb>=0.5"]
llm = ["google-genai>=1.0", "openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "chromadb>=0.5",
    "groq>=0.11",
    "websockets>=12",
    "google-genai>=1.0",
    "openai>=1.40",
]

[project.scripts]
navigator-record = "navigator.automation.record:main"

[tool.setuptools.packages.find]
include = ["navigator*"]

[tool.setuptools.package-data]
"navigator.knowledge" = ["sites/*.yaml", "products/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:navigator.*"]

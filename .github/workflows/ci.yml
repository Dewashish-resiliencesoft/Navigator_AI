name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      # Runs first and on its own so a stale-docs failure is unmistakable in the
      # log. Everything below assumes the committed docs match the code.
      - name: Docs are not stale
        run: python -m navigator.docs check

      - name: Tests
        run: python -m pytest -q

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  fern:
    runs-on: ubuntu-latest
    needs: python  # never validate a spec the python job just called stale
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: fern-api/setup-fern-cli@v1

      # No FERN_TOKEN needed for check, so this runs on forks too.
      - name: Check the Fern project
        run: fern check

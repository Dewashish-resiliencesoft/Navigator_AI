services:
  attendee-worker-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
      # Empty unless set in .env. Unset keeps the per-platform default (Meet 30fps, Zoom/Teams 60fps).
      - WEBPAGE_STREAMER_VIDEO_FRAME_SIZE=${WEBPAGE_STREAMER_VIDEO_FRAME_SIZE:-}
      - WEBPAGE_STREAMER_VIDEO_FPS=${WEBPAGE_STREAMER_VIDEO_FPS:-}
    command: "celery -A attendee worker -l INFO"

  attendee-scheduler-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - WEBPAGE_STREAMER_VIDEO_FRAME_SIZE=${WEBPAGE_STREAMER_VIDEO_FRAME_SIZE:-}
      - WEBPAGE_STREAMER_VIDEO_FPS=${WEBPAGE_STREAMER_VIDEO_FPS:-}
    command: "python manage.py run_scheduler"
    entrypoint: []

  attendee-app-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - WEBPAGE_STREAMER_VIDEO_FRAME_SIZE=${WEBPAGE_STREAMER_VIDEO_FRAME_SIZE:-}
      - WEBPAGE_STREAMER_VIDEO_FPS=${WEBPAGE_STREAMER_VIDEO_FPS:-}
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: []

  attendee-webpage-streamer-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=true
      # Unset size/fps fall through to the platform default. The meeting bot also
      # sends platform and fps on /offer so a Meet bot captures at 30, not 60.
      - WEBPAGE_STREAMER_PLATFORM=${WEBPAGE_STREAMER_PLATFORM:-}
      - WEBPAGE_STREAMER_VIDEO_FRAME_SIZE=${WEBPAGE_STREAMER_VIDEO_FRAME_SIZE:-}
      - WEBPAGE_STREAMER_VIDEO_FPS=${WEBPAGE_STREAMER_VIDEO_FPS:-}
      - WEBPAGE_STREAMER_VIDEO_BITRATE_KBPS=${WEBPAGE_STREAMER_VIDEO_BITRATE_KBPS:-}
    # Same 4 CPU / 8g budget as the Kubernetes webpage-streamer pod.
    cpus: "4"
    mem_limit: 8g
    command: "python bots/webpage_streamer/run_webpage_streamer.py --platform ${WEBPAGE_STREAMER_PLATFORM:-local}"
    security_opt:
      - seccomp=./bots/web_bot_adapter/chrome_seccomp.json
    profiles:
      - webpage-streamer


  postgres:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: attendee_development
      POSTGRES_USER: attendee_development_user
      POSTGRES_PASSWORD: attendee_development_user
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    networks:
      - attendee_network
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    networks:
      - attendee_network
    restart: unless-stopped
    volumes:
      - redis:/data/redis

networks:
  attendee_network:
    driver: bridge

volumes:
  postgres:
  redis:

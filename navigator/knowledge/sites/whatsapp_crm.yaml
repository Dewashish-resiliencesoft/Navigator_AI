# Site graph for the WhatsApp CRM dashboard.
#
# HAND-AUTHORED. The agent never infers any of this -- selectors, flows, and
# postconditions are all declared here and looked up at runtime. Bump `version`
# whenever a selector changes so ActionLog rows stay attributable to a revision.
#
# Phase 1 points base_url at the committed HTML fixture. To demo the real
# product, change base_url and the selectors; no Python changes needed.

version: 1
site: whatsapp-crm
base_url: ../../../tests/fixtures/

# How the agent introduces this product. Narration lives here, not in code, so
# one deployment can demo many products.
persona:
  product_name: the WhatsApp CRM dashboard
  one_liner: a shared inbox for sales teams working out of WhatsApp
  agent_name: Navigator AI
  tone: friendly, concise, technical when asked

pages:
  inbox:
    name: Inbox
    url: crm_dashboard.html
    selectors:
      search_box: "#contact-search"
      contact_row: "[data-testid='contact-row']"
      contact_list: "#contact-list"
      thread_title: "#thread-title"
      thread: "#thread"
      composer: "#composer"
      message_input: "#message-input"
      send_button: "#send-btn"
      sent_bubble: ".message.sent"
      empty_thread: "#empty-thread"

    flows:
      # The Phase 1 scripted demo: open the inbox, type a message, send it,
      # confirm the bubble landed. Every step declares its own postcondition.
      send_test_message:
        - tool: navigate
          page_id: inbox
          expects:
            check: visible
            selector: composer

        - tool: wait_for
          selector: message_input
          timeout_ms: 3000
          expects:
            check: visible
            selector: message_input

        - tool: fill_field
          selector: message_input
          value: "Hi from Navigator AI"
          source: agent
          expects:
            check: value_equals
            selector: message_input
            expected: "Hi from Navigator AI"

        - tool: click_element
          selector: send_button
          expects:
            check: text_contains
            selector: sent_bubble
            expected: "Hi from Navigator AI"

      # Second flow, unused in Phase 1, kept as a worked example of the
      # element_count and hidden checks for whoever authors the real site graph.
      search_contact:
        - tool: fill_field
          selector: search_box
          value: "Priya"
          source: user
          expects:
            check: element_count
            selector: contact_row
            expected: "3"

        - tool: click_element
          selector: contact_row
          expects:
            check: text_contains
            selector: thread_title
            expected: "Priya"

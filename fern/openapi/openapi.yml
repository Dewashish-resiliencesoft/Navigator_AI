components:
  schemas:
    ActionLogEntry:
      properties:
        call_id:
          type: string
          format: uuid
          title: Call Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        product_id:
          type: string
          title: Product Id
          default: default
        page:
          type: string
          title: Page
        tool_call:
          oneOf:
          - $ref: '#/components/schemas/ClickElement'
          - $ref: '#/components/schemas/FillField'
          - $ref: '#/components/schemas/Navigate'
          - $ref: '#/components/schemas/WaitFor'
          title: Tool Call
          discriminator:
            propertyName: tool
            mapping:
              click_element: '#/components/schemas/ClickElement'
              fill_field: '#/components/schemas/FillField'
              navigate: '#/components/schemas/Navigate'
              wait_for: '#/components/schemas/WaitFor'
        expected_postcondition:
          $ref: '#/components/schemas/Postcondition'
        actual_result:
          $ref: '#/components/schemas/ToolResult'
        verify:
          anyOf:
          - $ref: '#/components/schemas/VerifyResult'
          - type: 'null'
        source:
          type: string
          enum:
          - agent
          - user
          title: Source
          default: agent
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - session_id
      - page
      - tool_call
      - expected_postcondition
      - actual_result
      - timestamp
      title: ActionLogEntry
      description: 'One tool call, what it expected, and what actually happened.


        This is the unit reflection reads from. `expected_postcondition` duplicates

        `tool_call.expects` so the log can be queried on it without deserializing the

        whole call.'
    ApproveCorrectionBody:
      properties:
        rule:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule
      type: object
      title: ApproveCorrectionBody
      description: Optional override when promoting a pending rule into Chroma.
    BioBody:
      properties:

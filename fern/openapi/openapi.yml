# Generated by `python -m navigator.docs build` from the live FastAPI
# schema. Do not edit by hand -- tests/test_docs.py fails when this drifts.
openapi: 3.1.0
info:
  title: Navigator AI
  description: Live interactive demo agent for any web product.
  version: 0.1.0
paths:
  /v1/products:
    post:
      summary: Register Product
      description: Register a product. The API key in the response is shown exactly once.
      operationId: register_product_v1_products_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredProduct'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/me:
    get:
      summary: Whoami
      operationId: whoami_v1_products_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/site-graph:
    put:
      summary: Upload Site Graph
      description: 'Validate and store a new site graph revision, and make it active.


        Validation runs before anything is written, so a rejected upload cannot break

        a live demo. The error text is identical to what the file loader produces --

        there is one validator in the system, deliberately.'
      operationId: upload_site_graph_v1_products_site_graph_put
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteGraphUpload'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteGraphRevision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Get Site Graph
      operationId: get_site_graph_v1_products_site_graph_get
      parameters:
      - name: revision
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Revision
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteGraphRevision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/site-graph/revisions:
    get:
      summary: List Revisions
      operationId: list_revisions_v1_products_site_graph_revisions_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteGraphRevision'
                title: Response List Revisions V1 Products Site Graph Revisions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/site-graph/activate:
    post:
      summary: Activate Revision
      description: Roll back to an earlier revision.
      operationId: activate_revision_v1_products_site_graph_activate_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_activate_revision_v1_products_site_graph_activate_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/flows:
    get:
      summary: List Flows
      description: Which flows this product's active site graph offers, per page.
      operationId: list_flows_v1_products_flows_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                title: Response List Flows V1 Products Flows Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demos:
    post:
      summary: Start Demo
      description: Start a demo. Returns immediately; poll GET /v1/demos/{id} for progress.
      operationId: start_demo_v1_demos_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDemo'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Demos
      operationId: list_demos_v1_demos_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoView'
                title: Response List Demos V1 Demos Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demos/{demo_id}:
    get:
      summary: Get Demo
      operationId: get_demo_v1_demos__demo_id__get
      parameters:
      - name: demo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demo Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demos/{demo_id}/end:
    post:
      summary: End Demo
      operationId: end_demo_v1_demos__demo_id__end_post
      parameters:
      - name: demo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demo Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demos/{demo_id}/actions:
    get:
      summary: Demo Actions
      description: 'The ActionLog for one demo: every call, its expectation, and what happened.


        This is the audit trail that makes the product sellable -- a customer can see

        exactly what the agent did in front of their prospect.'
      operationId: demo_actions_v1_demos__demo_id__actions_get
      parameters:
      - name: demo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Demo Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionLogEntry'
                title: Response Demo Actions V1 Demos  Demo Id  Actions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/failures:
    get:
      summary: Product Failures
      description: Recent failures across all demos of this product -- which flows are rotting.
      operationId: product_failures_v1_products_failures_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionLogEntry'
                title: Response Product Failures V1 Products Failures Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/corrections/pending:
    get:
      summary: Pending Corrections
      description: 'Reflection output awaiting human approval.


        Never auto-promoted: an agent that can silently rewrite its own rules is

        not debuggable.'
      operationId: pending_corrections_v1_products_corrections_pending_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Pending Corrections V1 Products Corrections Pending Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/corrections/{correction_id}/approve:
    post:
      summary: Approve Correction
      description: "Human approves a pending rule \u2192 live Chroma corrections collection."
      operationId: approve_correction_v1_products_corrections__correction_id__approve_post
      parameters:
      - name: correction_id
        in: path
        required: true
        schema:
          type: string
          title: Correction Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApproveCorrectionBody'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Approve Correction V1 Products Corrections  Correction Id  Approve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/corrections/{correction_id}/reject:
    post:
      summary: Reject Correction
      operationId: reject_correction_v1_products_corrections__correction_id__reject_post
      parameters:
      - name: correction_id
        in: path
        required: true
        schema:
          type: string
          title: Correction Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Reject Correction V1 Products Corrections  Correction Id  Reject Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/products/knowledge:
    post:
      summary: Ingest Knowledge
      description: Add a product_knowledge doc for planning retrieval.
      operationId: ingest_knowledge_v1_products_knowledge_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeIngestBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Knowledge V1 Products Knowledge Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
components:
  schemas:
    ActionLogEntry:
      properties:
        call_id:
          type: string
          format: uuid
          title: Call Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        product_id:
          type: string
          title: Product Id
          default: default
        page:
          type: string
          title: Page
        tool_call:
          oneOf:
          - $ref: '#/components/schemas/ClickElement'
          - $ref: '#/components/schemas/FillField'
          - $ref: '#/components/schemas/Navigate'
          - $ref: '#/components/schemas/WaitFor'
          title: Tool Call
          discriminator:
            propertyName: tool
            mapping:
              click_element: '#/components/schemas/ClickElement'
              fill_field: '#/components/schemas/FillField'
              navigate: '#/components/schemas/Navigate'
              wait_for: '#/components/schemas/WaitFor'
        expected_postcondition:
          $ref: '#/components/schemas/Postcondition'
        actual_result:
          $ref: '#/components/schemas/ToolResult'
        verify:
          anyOf:
          - $ref: '#/components/schemas/VerifyResult'
          - type: 'null'
        source:
          type: string
          enum:
          - agent
          - user
          title: Source
          default: agent
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - session_id
      - page
      - tool_call
      - expected_postcondition
      - actual_result
      - timestamp
      title: ActionLogEntry
      description: 'One tool call, what it expected, and what actually happened.


        This is the unit reflection reads from. `expected_postcondition` duplicates

        `tool_call.expects` so the log can be queried on it without deserializing the

        whole call.'
    ApproveCorrectionBody:
      properties:
        rule:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule
      type: object
      title: ApproveCorrectionBody
      description: Optional override when promoting a pending rule into Chroma.
    Body_activate_revision_v1_products_site_graph_activate_post:
      properties:
        revision:
          type: integer
          title: Revision
      type: object
      required:
      - revision
      title: Body_activate_revision_v1_products_site_graph_activate_post
    ClickElement:
      properties:
        expects:
          $ref: '#/components/schemas/Postcondition'
        tool:
          type: string
          const: click_element
          title: Tool
          default: click_element
        selector:
          type: string
          title: Selector
      type: object
      required:
      - expects
      - selector
      title: ClickElement
    DemoView:
      properties:
        demo_id:
          type: string
          format: uuid
          title: Demo Id
        product_id:
          type: string
          title: Product Id
        revision:
          type: integer
          title: Revision
        session_id:
          type: string
          format: uuid
          title: Session Id
        status:
          type: string
          title: Status
        page_id:
          type: string
          title: Page Id
        actions:
          type: integer
          title: Actions
        failures:
          type: integer
          title: Failures
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        said:
          items:
            type: string
          type: array
          title: Said
      type: object
      required:
      - demo_id
      - product_id
      - revision
      - session_id
      - status
      - page_id
      - actions
      - failures
      title: DemoView
    FillField:
      properties:
        expects:
          $ref: '#/components/schemas/Postcondition'
        tool:
          type: string
          const: fill_field
          title: Tool
          default: fill_field
        selector:
          type: string
          title: Selector
        value:
          type: string
          title: Value
        source:
          type: string
          enum:
          - agent
          - user
          title: Source
          default: agent
      type: object
      required:
      - expects
      - selector
      - value
      title: FillField
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KnowledgeIngestBody:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
      type: object
      required:
      - text
      title: KnowledgeIngestBody
    Navigate:
      properties:
        expects:
          $ref: '#/components/schemas/Postcondition'
        tool:
          type: string
          const: navigate
          title: Tool
          default: navigate
        page_id:
          type: string
          title: Page Id
      type: object
      required:
      - expects
      - page_id
      title: Navigate
    NewDemo:
      properties:
        page_id:
          type: string
          title: Page Id
        flow_id:
          type: string
          title: Flow Id
        meeting_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Meeting Url
      type: object
      required:
      - page_id
      - flow_id
      title: NewDemo
    NewProduct:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        product_id:
          anyOf:
          - type: string
            pattern: ^[a-z0-9][a-z0-9_-]{1,63}$
          - type: 'null'
          title: Product Id
      type: object
      required:
      - name
      title: NewProduct
    Postcondition:
      properties:
        check:
          type: string
          enum:
          - visible
          - hidden
          - text_contains
          - value_equals
          - url_matches
          - element_count
          title: Check
        selector:
          anyOf:
          - type: string
          - type: 'null'
          title: Selector
        expected:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected
        timeout_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: Timeout Ms
          default: 5000
      type: object
      required:
      - check
      title: Postcondition
      description: 'What must hold after a tool call.


        Declared at call time by whoever issues the call, checked in VERIFYING against

        real DOM state. `selector` is a SiteGraph alias, never raw CSS -- the alias is

        resolved through the site graph so a DOM change is a config edit.'
    Product:
      properties:
        product_id:
          type: string
          title: Product Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        active_revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Revision
      type: object
      required:
      - product_id
      - name
      - created_at
      title: Product
    RegisteredProduct:
      properties:
        product:
          $ref: '#/components/schemas/Product'
        api_key:
          type: string
          title: Api Key
      type: object
      required:
      - product
      - api_key
      title: RegisteredProduct
      description: Registration response. The API key is shown exactly once.
    SiteGraphRevision:
      properties:
        product_id:
          type: string
          title: Product Id
        revision:
          type: integer
          title: Revision
        source:
          type: string
          enum:
          - yaml
          - recorded
          - sdk
          title: Source
        yaml:
          type: string
          title: Yaml
        created_at:
          type: string
          format: date-time
          title: Created At
        site:
          type: string
          title: Site
        graph_version:
          type: integer
          title: Graph Version
      type: object
      required:
      - product_id
      - revision
      - source
      - yaml
      - created_at
      - site
      - graph_version
      title: SiteGraphRevision
    SiteGraphUpload:
      properties:
        yaml:
          type: string
          minLength: 1
          title: Yaml
        source:
          type: string
          enum:
          - yaml
          - recorded
          - sdk
          title: Source
          default: yaml
      type: object
      required:
      - yaml
      title: SiteGraphUpload
    ToolResult:
      properties:
        ok:
          type: boolean
          title: Ok
        tool:
          type: string
          title: Tool
        detail:
          type: string
          title: Detail
          default: ''
        duration_ms:
          type: integer
          title: Duration Ms
      type: object
      required:
      - ok
      - tool
      - duration_ms
      title: ToolResult
      description: 'Whether the Playwright action itself succeeded.


        Says nothing about whether the postcondition holds -- that is VerifyResult.

        A tool that raises is still a ToolResult with ok=False, never an exception

        escaping into the state machine.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyResult:
      properties:
        passed:
          type: boolean
          title: Passed
        actual:
          type: string
          title: Actual
        ambiguous:
          type: boolean
          title: Ambiguous
          default: false
      type: object
      required:
      - passed
      - actual
      title: VerifyResult
    WaitFor:
      properties:
        expects:
          $ref: '#/components/schemas/Postcondition'
        tool:
          type: string
          const: wait_for
          title: Tool
          default: wait_for
        selector:
          type: string
          title: Selector
        timeout_ms:
          type: integer
          exclusiveMinimum: 0.0
          title: Timeout Ms
          default: 5000
      type: object
      required:
      - expects
      - selector
      title: WaitFor

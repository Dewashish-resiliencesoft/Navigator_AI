# ResilioHub live product guide (spoken tour + interrupt flows).
# Selectors stay coarse (body) until a recorder pass captures real UI aliases.
version: 1
site: resiliohub
base_url: https://resiliohub.com/

persona:
  product_name: ResilioHub
  one_liner: AI-powered WhatsApp CRM and engagement on the official WhatsApp Business API
  agent_name: Navigator
  tone: >
    warm, clear, calm, confident female ResilioHub product specialist;
    natural contractions; short spoken sentences; acknowledge the prospect's goal;
    honest about what needs a human (billing, Meta connect, account access);
    never invent prices beyond published INR plan ranges or store ratings

pages:
  dashboard:
    name: Dashboard
    url: /dashboard/
    selectors:
      body: "body"
    flows:
      default_walkthrough:
        - tool: wait_for
          selector: body
          timeout_ms: 8000
          spoken: >
            {name}, we're on the ResilioHub dashboard — home base for WhatsApp CRM.
            From here you see activity and shortcuts into the rest of the product.
            You asked about {need}; keep that in mind as we go.
          expects:
            check: visible
            selector: body
            timeout_ms: 8000

        - tool: navigate
          page_id: contacts
          spoken: >
            Next up: Contacts. Every lead and customer you talk to on WhatsApp
            is stored here so the team shares one source of truth.
          expects:
            check: url_matches
            expected: contacts

        - tool: wait_for
          selector: body
          timeout_ms: 5000
          spoken: >
            You can search, open a profile, and jump straight into their WhatsApp thread.
          expects:
            check: visible
            selector: body
            timeout_ms: 5000

        - tool: navigate
          page_id: inbox
          spoken: >
            Here's the shared Inbox — all WhatsApp conversations in one place
            so sales and support aren't bouncing between phones.
          expects:
            check: url_matches
            expected: inbox

        - tool: wait_for
          selector: body
          timeout_ms: 5000
          spoken: >
            Agents reply here, assign chats, and keep context when someone hands off.
          expects:
            check: visible
            selector: body
            timeout_ms: 5000

        - tool: navigate
          page_id: automations
          spoken: >
            Automations — chat flows that greet people, qualify leads, and route
            them without a human typing every message.
          expects:
            check: url_matches
            expected: chat_flow

        - tool: wait_for
          selector: body
          timeout_ms: 5000
          spoken: >
            You build the flow once; ResilioHub runs it on WhatsApp twenty-four seven.
          expects:
            check: visible
            selector: body
            timeout_ms: 5000

        - tool: navigate
          page_id: analytics
          spoken: >
            Analytics shows how those conversations convert — volume, response time,
            and what's working in the funnel.
          expects:
            check: url_matches
            expected: analytics

        - tool: wait_for
          selector: body
          timeout_ms: 5000
          spoken: >
            That's the core loop: contacts, inbox, automation, and analytics —
            WhatsApp CRM end to end.
          expects:
            check: visible
            selector: body
            timeout_ms: 5000

        - tool: navigate
          page_id: dashboard
          spoken: >
            Back on the dashboard. Ask me to open contacts, inbox, or automations
            anytime and I'll drive there live.
          expects:
            check: url_matches
            expected: dashboard

      show_contacts:
        - tool: navigate
          page_id: contacts
          spoken: Opening Contacts now.
          expects:
            check: url_matches
            expected: contacts

      show_inbox:
        - tool: navigate
          page_id: inbox
          spoken: Opening the shared Inbox now.
          expects:
            check: url_matches
            expected: inbox

      show_automations:
        - tool: navigate
          page_id: automations
          spoken: Opening Automations — the chat flow builder.
          expects:
            check: url_matches
            expected: chat_flow

      show_analytics:
        - tool: navigate
          page_id: analytics
          spoken: Opening Analytics.
          expects:
            check: url_matches
            expected: analytics

      show_dashboard:
        - tool: navigate
          page_id: dashboard
          spoken: Taking you back to the Dashboard.
          expects:
            check: url_matches
            expected: dashboard

  contacts:
    name: Contacts
    # Live app: /contacts/ 404'd; phonebook is the product contact list.
    url: /phonebook/
    selectors:
      body: "body"
    flows: {}

  inbox:
    name: Inbox
    url: /inbox/
    selectors:
      body: "body"
    flows: {}

  automations:
    name: Automations
    url: /chat_flow/
    selectors:
      body: "body"
    flows: {}

  analytics:
    name: Analytics
    url: /analytics/
    selectors:
      body: "body"
    flows: {}
